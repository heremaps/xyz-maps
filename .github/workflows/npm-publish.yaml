name: NPM Publish

on:
    push:
        branches:
            - "!*"
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
    test:
        uses: ./.github/workflows/cicd.yaml
        secrets: inherit

    deploy:
        needs: test
        runs-on: ubuntu-24.04
        permissions:
            id-token: write
            contents: read
        steps:
            -   uses: actions/checkout@v2
            -   name: Setup pnpm
                uses: pnpm/action-setup@v4
            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version-file: .nvmrc
                    registry-url: 'https://registry.npmjs.org'
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Build release
                run: pnpm run build-release
            -   name: Get npm dist-tag
                id: get-dist-tag
                run: |
                    distTag=$(jq -r '.version | match(".*-([^.]*)").captures[0].string' package.json)
                    echo "dist-tag=${distTag:-latest}" >> "$GITHUB_OUTPUT"
            -   name: npm publish
                run: pnpm exec lerna publish from-package --no-git-tag-version --yes --dist-tag ${{ steps.get-dist-tag.outputs.dist-tag }}
