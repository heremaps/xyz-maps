name: Vitest targeted diagnostics

on:
    push:
        branches:
            - chore/vitest-migration
    workflow_dispatch:

jobs:
    test:
        name: Model and turn restriction specs
        runs-on: ubuntu-24.04

        steps:
            -   uses: actions/checkout@v4
            -   name: Setup pnpm
                uses: pnpm/action-setup@v4
            -   name: Use Node.js from .nvmrc
                uses: actions/setup-node@v4
                with:
                    node-version-file: .nvmrc
                    registry-url: 'https://registry.npmjs.org'
                    cache: pnpm
                env:
                    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Build release package
                run: pnpm run build-release
            -   name: Run affected specs
                run: >-
                    pnpm test --project display --project editor
                    specs/display/layer/style_type_model.ts
                    specs/editor/turnrestriction/turn_restrictions_validate_spec.ts
                    --silent=false
            -   name: Upload test report
                if: always()
                uses: actions/upload-artifact@v4
                with:
                    name: vitest-targeted-report
                    path: packages/tests/dist/vitest/report.json
                    if-no-files-found: ignore
