name: Build & Test

on:
    push:
        branches:
            - master
            - tests
    pull_request:
        branches:
            - '*'
    workflow_call:
    workflow_dispatch:
        inputs:
            component:
                description: Test component
                type: choice
                default: all
                options:
                    - all
                    - common
                    - core
                    - display
                    - editor
            workers:
                description: Test workers (serial disables file parallelism)
                type: choice
                default: serial
                options:
                    - serial
                    - '4'
                    - '12'

jobs:
    build:
        name: Test (${{ matrix.os }})
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ ubuntu-24.04 ]

        steps:
            -   uses: actions/checkout@v2
            -   name: Setup pnpm
                uses: pnpm/action-setup@v4
            -   name: Use Node.js from .nvmrc
                uses: actions/setup-node@v4
                with:
                    node-version-file: .nvmrc
                    registry-url: 'https://registry.npmjs.org'
                    cache: pnpm
                env:
                    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Build release package
                run: pnpm run build-release
            -   name: Typecheck test specs
                run: pnpm --filter @here/xyz-maps-test run typecheck
            -   name: Run tests
                env:
                    TEST_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'all' }}
                    TEST_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.workers || 'serial' }}
                shell: bash
                run: |
                    args=()
                    case "$TEST_COMPONENT" in
                        all) ;;
                        common|core|display|editor) args+=(--project "$TEST_COMPONENT") ;;
                        *) echo "Unknown test component: $TEST_COMPONENT" >&2; exit 1 ;;
                    esac
                    case "$TEST_WORKERS" in
                        serial) args+=(--no-fileParallelism --maxWorkers 1) ;;
                        4|12) args+=(--fileParallelism --maxWorkers "$TEST_WORKERS") ;;
                        *) echo "Unknown test workers: $TEST_WORKERS" >&2; exit 1 ;;
                    esac
                    pnpm test "${args[@]}"
