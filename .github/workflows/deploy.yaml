name: Docs & Playground

on:
    workflow_dispatch:
        inputs:
            skip_tests:
                description: Skip the test run before deploying (manual runs only)
                type: boolean
                default: false
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
    test:
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        uses: ./.github/workflows/cicd.yaml
        secrets: inherit

    deploy:
        needs: test
        if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v2
            -   name: Setup pnpm
                uses: pnpm/action-setup@v4
            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version-file: .nvmrc
                    cache: pnpm
            -   name: Install dependencies
                run: pnpm install --frozen-lockfile
            -   name: Build documentation
                run: pnpm run build-doc
            -   name: Build release
                run: pnpm run build-release
            -   name: Build playground
                env:
                    BUILD: production
                    DOC_PATH: ../docs/
                    API_PATH: ../
                    TOKEN_PATH: ${{ secrets.TOKEN_PATH }}
                run: |
                    if [ -z "$TOKEN_PATH" ]; then
                        echo "TOKEN_PATH secret must be configured for playground deployment." >&2
                        exit 1
                    fi
                    pnpm run build-playground
            -   name: Preapre deployment
                run: node scripts/prepare-pages.js
            -   name: Deploy to gh-pages
                uses: peaceiris/actions-gh-pages@v3
                with:
                    github_token: ${{ secrets.GITHUB_TOKEN }}
                    publish_dir: ./deploy
                    force_orphan: true
